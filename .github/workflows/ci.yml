name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Syntax check
        run: |
          python -m py_compile main.py pixi.py

      - name: CLI smoke test
        env:
          PIXI_DATA_DIR: /tmp/pixi-ci-data
        run: |
          mkdir -p /tmp/pixi-ci-data
          cp examples/sample_tasks.json /tmp/pixi-ci-data/tasks.json
          pixi --help
          pixi list
          pixi stats
          pixi report || true

      - name: TUI import check
        env:
          PIXI_DATA_DIR: /tmp/pixi-ci-data
        run: |
          python -c "import main; print('TUI imports OK')"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (syntax-level checks)
        run: ruff check main.py pixi.py --select E9,F63,F7,F82,F401 --exit-zero
