[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixi-matrix"
version = "1.0.0"
description = "Keyboard-driven Eisenhower Matrix task manager for the terminal — with a gamified daily scoring system (CLI + TUI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "BitEngineX" },
]
keywords = [
    "task-manager",
    "eisenhower-matrix",
    "productivity",
    "tui",
    "cli",
    "textual",
    "terminal",
    "todo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
pixi = "pixi:main"

[project.urls]
Homepage = "https://github.com/BitEngineX/pixi"
Repository = "https://github.com/BitEngineX/pixi"
Issues = "https://github.com/BitEngineX/pixi/issues"

[tool.setuptools]
py-modules = ["pixi"]

[tool.ruff]
line-length = 120
target-version = "py39"
